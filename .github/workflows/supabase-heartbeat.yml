# Keep the Supabase Free plan project from pausing, and keep this schedule itself enabled.
# Supabase Free pauses after ~7 days with no API activity (see README).
# GitHub disables scheduled workflows on a public repo after 60 days with no
# commit on the default branch. A successful run does not count as that commit.
name: Supabase heartbeat

on:
  schedule:
    # 09:17 UTC, off the top of the hour (GitHub drops some :00 jobs when busy).
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read database (counts as Supabase activity)
        run: |
          set -euo pipefail
          # Publishable anon key — same as shared.js (client-safe, RLS-protected)
          SB_URL='https://qkmukcuqosvlumsrqyay.supabase.co'
          SB_KEY='sb_publishable_dkJN0bxvkkW7JHXAvZ62XQ_tpxexARU'
          curl -sf --retry 3 --retry-delay 5 "${SB_URL}/rest/v1/races?select=id&limit=1" \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}" \
            -H "Accept: application/json"
          echo ""
          echo "Supabase heartbeat OK at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Keep scheduled workflows enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN does not start other workflows, so
          # this empty commit does not redeploy GitHub Pages.
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Last commit on this branch was ${AGE_DAYS} day(s) ago."
          if [ "$AGE_DAYS" -lt 30 ]; then
            echo "Repo has been active recently. No keepalive commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows enabled"
          git push
